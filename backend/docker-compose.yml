services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nextgen
      POSTGRES_PASSWORD: nextgen
      POSTGRES_DB: nextgen_autoworkshop
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextgen -d nextgen_autoworkshop"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
